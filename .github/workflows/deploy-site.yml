name: Deploy Giulio Lattanzio website

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          repository: giuliolattanzio/giuliolattanzio-website
          ref: main
          path: site

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Set GitHub Pages public URL
        working-directory: site
        run: |
          sed -i 's#https://giuliolattanzio.pages.dev/#https://giuliolattanzio.github.io/#g' astro-paper.config.ts
          sed -i 's#https://giuliolattanzio.pages.dev#https://giuliolattanzio.github.io#g' public/robots.txt

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: site
        run: pnpm build

      - name: Remove host-specific control files
        working-directory: site
        run: rm -f dist/_headers dist/_redirects

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
